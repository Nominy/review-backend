name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: review-backend-production

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out shared build dependencies
        env:
          BABEL_EXTENSION_PLATFORM_REF: ${{ vars.BABEL_EXTENSION_PLATFORM_REF }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BABEL_EXTENSION_PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Set BABEL_EXTENSION_PLATFORM_REF to the published shared-platform commit SHA providing the frontend UI and E2E build exports."
            exit 1
          fi
          mkdir -p ../../shared
          git clone https://github.com/Nominy/babel-extension-platform.git ../../shared/babel-extension-platform
          git -C ../../shared/babel-extension-platform checkout "$BABEL_EXTENSION_PLATFORM_REF"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Node.js for Lab assets
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Review Lab assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ../../shared/babel-extension-platform/packages/babel-extension-e2e/fixtures/recreation/app
          npm run build:lab
          tar -czf "$RUNNER_TEMP/review-lab-dist.tgz" -C dist .

      - name: Install SSH helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        env:
          OPENROUTER_TEST_MODE: "false"
        run: bun run test

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PASSWORD"
          test -n "$DEPLOY_PATH"

      # The failed 34157378420 run filled the disk before changing the checkout.
      # Remove only that incomplete copy; live runtime data and older backups stay intact.
      - name: Recover space from the incomplete deployment backup
        shell: bash
        run: |
          set -euo pipefail
          SSHPASS="$SERVER_PASSWORD" sshpass -e ssh \
            -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            "$SERVER_USER@$SERVER_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          test -d "$DEPLOY_PATH/data"
          failed_backup=/opt/review/backups/review-backend-20260907T195525Z
          if [ -e "$failed_backup" ]; then
            test ! -L "$failed_backup"
            test "$(readlink -f "$failed_backup")" = /opt/review/backups/review-backend-20260907T195525Z
            rm -rf --one-file-system -- "$failed_backup"
          fi
          df -h "$DEPLOY_PATH"
          REMOTE

      - name: Deploy over SSH
        env:
          SSHOPTS: >-
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=120
            -o ConnectTimeout=20
            -o TCPKeepAlive=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=/dev/null
            -o LogLevel=ERROR
          REMOTE_STEP_ATTEMPTS: "3"
          REMOTE_STEP_DELAY_SECONDS: "10"
          SSH_COMMAND_TIMEOUT_SECONDS: "900"
        shell: bash
        run: |
          set -euo pipefail

          deploy_log="$RUNNER_TEMP/review-backend-deploy.log"
          touch "$deploy_log"

          log() {
            printf '[%s] %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$*" | tee -a "$deploy_log"
          }


          run_remote_step() {
            local step_name="$1"
            local step_script="$2"
            local attempt
            local remote_log
            local status
            local attempts="${REMOTE_STEP_ATTEMPTS}"
            local delay_seconds="${REMOTE_STEP_DELAY_SECONDS}"
            local timeout_seconds="${SSH_COMMAND_TIMEOUT_SECONDS}"
            local run_id
            local script_path

            run_id="$(date -u +%Y%m%dT%H%M%SZ)"
            script_path="$(mktemp)"
            printf '%s\n' "$step_script" > "$script_path"
            chmod 700 "$script_path"

            for attempt in $(seq 1 "$attempts"); do
              remote_log="/tmp/review-backend-${step_name}-${run_id}-attempt-${attempt}.log"

              log "Starting remote step '${step_name}' (attempt ${attempt}/${attempts})"
              set +e
              set -o pipefail
              SSHPASS="$SERVER_PASSWORD" timeout "$timeout_seconds" \
                sshpass -e ssh \
                  $SSHOPTS \
                  "$SERVER_USER@$SERVER_HOST" \
                  "DEPLOY_PATH='$DEPLOY_PATH' GIT_COMMIT='$GITHUB_SHA' GIT_BRANCH='$GITHUB_REF_NAME' DEPLOY_STEP='$step_name' DEPLOY_LOG_FILE='$remote_log' bash -se" \
                  < "$script_path" |& tee -a "$deploy_log"
              status=$?
              set +o pipefail
              set -e

              if [ "$status" -eq 0 ]; then
                log "Remote step '${step_name}' succeeded on attempt ${attempt}"
                rm -f "$script_path"
                return 0
              fi

              log "Remote step '${step_name}' failed on attempt ${attempt} (exit ${status})"
              log "Remote step '${step_name}' diagnostics:"
              SSHPASS="$SERVER_PASSWORD" timeout "$timeout_seconds" \
                sshpass -e ssh \
                  $SSHOPTS \
                  "$SERVER_USER@$SERVER_HOST" \
                  "tail -n 240 '$remote_log' 2>/dev/null || true" | tee -a "$deploy_log"

              if [ "$attempt" -lt "$attempts" ]; then
                log "Retrying step '${step_name}' in ${delay_seconds}s"
                sleep "$delay_seconds"
                continue
              fi
            done

            rm -f "$script_path"
            return 1
          }

          prep_script='
          set -euo pipefail

          exec > >(tee -a "$DEPLOY_LOG_FILE") 2>&1

          log() {
            printf "[%s] %s\n" "$(date -u "+%Y-%m-%dT%H:%M:%SZ")" "$*"
          }

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${GIT_COMMIT:?GIT_COMMIT is required}"
          : "${GIT_BRANCH:?GIT_BRANCH is required}"

          cd "$DEPLOY_PATH"

          backup_root="/opt/review/backups"
          backup_dir="$backup_root/review-backend-$(date -u +%Y%m%dT%H%M%SZ)"
          umask 077
          mkdir -p "$backup_dir"
          backup_paths=()
          for entry in .env.runtime data templates; do
            [ ! -e "$entry" ] || backup_paths+=("$entry")
          done
          if [ "${#backup_paths[@]}" -gt 0 ]; then
            # Old deployments restored a directory into itself, creating data/data.
            # Those old nested copies remain on disk but are not copied again.
            tar --exclude=data/data --exclude=templates/templates \
              -czf "$backup_dir/runtime.tar.gz" "${backup_paths[@]}"
          fi
          log "Backed up active runtime data to $backup_dir"

          if [ -d .git ]; then
            git rev-parse HEAD > .deploy-previous-commit
          fi
          log "Stored previous deployment commit marker"

          git fetch origin main
          git reset --hard "$GIT_COMMIT"
          git clean -fd -e .deploy-previous-commit -e .env.runtime -e data/ -e logs/ -e node_modules/ -e templates/

          # Ignored runtime data stays in place across reset/clean; do not restore
          # directory trees into themselves and create nested duplicate copies.

          mkdir -p logs/pm2
          touch .env.runtime
          chmod 600 .env.runtime
          tmp_env="$(mktemp)"
          awk "!/^(OPENROUTER_API_KEY|OPENROUTER_MODEL|GIT_COMMIT|GIT_BRANCH)=/" .env.runtime > "$tmp_env"
          printf "OPENROUTER_MODEL=google/gemini-3.7-flash\n" >> "$tmp_env"
          printf "GIT_COMMIT=%s\n" "$GIT_COMMIT" >> "$tmp_env"
          printf "GIT_BRANCH=%s\n" "$GIT_BRANCH" >> "$tmp_env"
          mv "$tmp_env" .env.runtime
          chmod 600 .env.runtime
          log "Rewrote .env.runtime"
          '

          install_script='
          set -euo pipefail
          exec > >(tee -a "$DEPLOY_LOG_FILE") 2>&1

          log() {
            printf "[%s] %s\n" "$(date -u "+%Y-%m-%dT%H:%M:%SZ")" "$*"
          }

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          cd "$DEPLOY_PATH"

          log "Installing dependencies with bun"
          bun install --frozen-lockfile --production
          log "Dependencies installed"
          mkdir -p dist
          tar -xzf .review-lab-dist.tgz -C dist
          bun scripts/refresh-review-templates.mjs templates data/templates
          rm .review-lab-dist.tgz
          log "Installed Lab assets and refreshed known guideline templates"
          '

          service_script='
          set -euo pipefail
          exec > >(tee -a "$DEPLOY_LOG_FILE") 2>&1

          log() {
            printf "[%s] %s\n" "$(date -u "+%Y-%m-%dT%H:%M:%SZ")" "$*"
          }

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          cd "$DEPLOY_PATH"

          log "Restarting PM2 process"
          mkdir -p logs/pm2
          pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
          pm2 save
          pm2 status
          log "PM2 restart completed"
          '

          health_script='
          set -euo pipefail
          exec > >(tee -a "$DEPLOY_LOG_FILE") 2>&1

          log() {
            printf "[%s] %s\n" "$(date -u "+%Y-%m-%dT%H:%M:%SZ")" "$*"
          }

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          cd "$DEPLOY_PATH"

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              log "Health check passed on attempt $attempt"
              exit 0
            fi

            log "Health check failed on attempt $attempt/60"
            sleep 2
          done

          log "Health check timed out; dumping pm2 logs"
          pm2 status
          tail -n 120 logs/pm2/review-backend.out.log || true
          tail -n 120 logs/pm2/review-backend.error.log || true
          exit 1
          '

          rollback_script='
          set -euo pipefail
          exec > >(tee -a "$DEPLOY_LOG_FILE") 2>&1

          log() {
            printf "[%s] %s\n" "$(date -u "+%Y-%m-%dT%H:%M:%SZ")" "$*"
          }

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          rollback_marker_file="$DEPLOY_PATH/.deploy-previous-commit"
          if [ ! -f "$rollback_marker_file" ]; then
            log "Rollback marker missing: $rollback_marker_file"
            exit 1
          fi

          previous_commit="$(cat "$rollback_marker_file")"
          if [ -z "$previous_commit" ]; then
            log "Rollback marker is empty"
            exit 1
          fi

          cd "$DEPLOY_PATH"
          git checkout "$previous_commit"
          bun install --frozen-lockfile --production
          pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
          pm2 save
          log "Rolled back to $previous_commit"
          '

          if ! run_remote_step "prepare" "$prep_script"; then
            log "Deployment prepare step failed"
            exit 1
          fi

          log "Uploading prebuilt Review Lab assets"
          SSHPASS="$SERVER_PASSWORD" sshpass -e scp $SSHOPTS \
            "$RUNNER_TEMP/review-lab-dist.tgz" "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/.review-lab-dist.tgz"

          if ! run_remote_step "install" "$install_script"; then
            log "Dependency installation step failed"
            exit 1
          fi

          if ! run_remote_step "service" "$service_script"; then
            log "Service restart step failed"
            exit 1
          fi

          if ! run_remote_step "health" "$health_script"; then
            log "Health check failed; attempting rollback"
            if run_remote_step "rollback" "$rollback_script"; then
              log "Rollback completed successfully; verifying health after rollback"
              if run_remote_step "health" "$health_script"; then
                log "Rollback health check passed"
              else
                log "Rollback health check failed"
              fi
            fi
            exit 1
          fi

          log "Deployment completed successfully"
